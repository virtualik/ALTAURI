<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a24; font-family: sans-serif; }
        /* Canvas занимает весь экран и находится на заднем плане */
        #openfl-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Маркетинговый оверлей поверх Canvas */
        .hero-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; /* Пропускаем клики сквозь пустые места к Canvas! */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, transparent 40%, rgba(26, 26, 36, 0.8) 100%);
        }
        
        .hero-text { text-align: center; color: white; pointer-events: auto; }
        .hero-text h1 { font-size: 4rem; margin-bottom: 10px; text-shadow: 0 0 20px #00AAFF; }
        .hero-text p { font-size: 1.5rem; color: #888899; margin-bottom: 40px; }
        
        .cta-button {
            pointer-events: auto; padding: 15px 40px; font-size: 1.2rem;
            background: #00AAFF; color: white; border: none; border-radius: 8px;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta-button:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 170, 255, 0.5); }
    </style>
</head>
<body>
    <div id="openfl-content"></div>
    
    <div class="hero-overlay">
        <div class="hero-text">
            <h1>ViAPORTS TERMINAL</h1>
            <p>COMPORTS Interconnection.</p>
            <button class="cta-button" onclick="window.location.href='https://virtualik.github.io/ATELIER/'">
                Запустить полный редактор →
            </button>
        </div>
    </div>
</body>
</html>
